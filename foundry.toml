[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/"]
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true

[profile.audit.fuzz]
runs = 10000

[profile.audit.invariant]
runs = 1000
depth = 256
fail_on_revert = true

[fmt]
line_length = 120
bracket_spacing = true
