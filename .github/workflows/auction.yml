name: Auction security suite
on:
  push:
    paths-ignore: ['docs/**', 'audit/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', 'audit/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - run: npm ci
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -r requirements-audit.txt
      - run: npm run interface:check
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auction-audit-evidence
          path: |
            audit/generated/
            lcov.info
          retention-days: 30
